# Cuts a release of @baizor/pipeline-runner: verify, publish to npm, tag.
#
# MANUAL ONLY. It does not fire on a pushed tag or a published GitHub Release —
# this workflow CREATES the release rather than reacting to one, so a release
# cannot exist that these checks never passed. That is the whole point of the
# change: previously a human made the Release by hand and the workflow ran
# afterwards, which meant the tag was already public while the suite was still
# running, and a red run left a released version nobody could unrelease.
#
# npm auth is npm Trusted Publishing (OIDC) — there is no npm token anywhere in
# this file. It requires an owner-only, one-time setup on npmjs.com (package
# Settings -> Trusted Publishers -> GitHub Actions, pointing at
# IvanMurzak/pipeline-runner + this workflow file). Without it the publish step
# fails with an auth error; that is configuration, not a bug here.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Must match package.json exactly — a mismatch fails the run."
        required: true
      dry_run:
        description: "Rehearse: run every check, publish and tag NOTHING."
        type: boolean
        default: false

permissions:
  id-token: write # OIDC token for npm Trusted Publishing
  contents: write # create the git tag + GitHub Release

concurrency:
  group: release-runner
  cancel-in-progress: false

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────────
  # Everything that can say NO lives here, and it publishes nothing. A release
  # is only as trustworthy as the last check that could still have stopped it.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags + history to check for an existing tag

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # npm Trusted Publishing requires Node >= 22.14.0 and npm >= 11.5.1. Pin
      # both rather than trusting the runner image; setup-node's bundled npm
      # can still be older than that at this Node version.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm >= 11.5.1 (required for Trusted Publishing/OIDC)
        run: npm install -g npm@^11.5.1

      # Releasing something that is not on main means releasing a commit no one
      # reviewed on the branch everyone reads.
      - name: Commit is on main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }

      # The input is a statement of intent; package.json is the fact. If they
      # disagree, the operator believes they are shipping something they are
      # not — so stop rather than pick a winner.
      - name: Version matches package.json
        id: version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          IN="${{ inputs.version }}"
          IN="${IN#v}"
          if [ "$PKG" != "$IN" ]; then
            echo "::error::input version '$IN' != package.json '$PKG'"; exit 1
          fi
          echo "value=$PKG" >> "$GITHUB_OUTPUT"
          echo "releasing $PKG"

      # Both are re-runs of a release that already happened. npm's own refusal
      # would come AFTER the suite, and the tag's would come after the publish —
      # either way, too late to be useful.
      - name: Version is not already published, tag does not exist
        run: |
          V="${{ steps.version.outputs.value }}"
          if npm view "@baizor/pipeline-runner@$V" version >/dev/null 2>&1; then
            echo "::error::@baizor/pipeline-runner@$V is already on npm"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::tag v$V already exists"; exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      # The lesson this repo actually learned: a green release job is not proof
      # the artifact is usable. `npm pack` produces the EXACT tarball publish
      # would upload, so unpack it and assert the entry point a consumer runs is
      # really inside — `files`/`.npmignore` mistakes are invisible until an
      # install fails at someone else's terminal.
      - name: Pack and inspect the real tarball
        run: |
          TARBALL="$(npm pack --silent)"
          echo "packed $TARBALL"
          mkdir -p /tmp/verify && tar -xzf "$TARBALL" -C /tmp/verify
          BIN="$(node -p "JSON.stringify(require('./package.json').bin)")"
          echo "bin: $BIN"
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const bins = typeof pkg.bin === "string" ? { [pkg.name]: pkg.bin } : (pkg.bin ?? {});
            const missing = Object.entries(bins).filter(
              ([, p]) => !fs.existsSync(require("path").join("/tmp/verify/package", p))
            );
            if (missing.length) {
              console.error("::error::bin entries missing from the tarball: " + JSON.stringify(missing));
              process.exit(1);
            }
            console.log("every bin entry is present in the tarball");
          '

  # ── Release ─────────────────────────────────────────────────────────────────
  # Only reachable when `verify` passed in full.
  release:
    name: Publish + tag
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No NODE_AUTH_TOKEN of any kind — auth is OIDC Trusted Publishing via the
      # id-token permission. --provenance and --access are explicit even though
      # publishConfig already sets access.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public

      # The tag is cut AFTER a successful publish, on purpose: a tag that exists
      # without the package on npm is a release you cannot install, and it is
      # the harder of the two to clean up.
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$V" \
            --title "v$V" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Verify the published version resolves
        env:
          V: ${{ needs.verify.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view "@baizor/pipeline-runner@$V" version >/dev/null 2>&1; then
              echo "npm serves $V"; exit 0
            fi
            echo "not visible yet, retrying ($i)"; sleep 10
          done
          echo "::error::published, but npm does not serve $V"; exit 1
